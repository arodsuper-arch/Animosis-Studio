<?xml version="1.0" encoding="UTF-8"?>
<!--
  Animosis Studio — small-size mark (16-24px).
  Hinted variant of animosis-mark.svg: thicker strokes, A crossbar dropped,
  flat red instead of a gradient. Below 24px the gradient banding and the
  crossbar both turn to mud, so they are removed rather than scaled.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256" role="img" aria-label="Animosis Studio">
  <defs>
    <linearGradient id="a16-chrome" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#666666"/>
      <stop offset="46%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <mask id="a16-cut">
      <rect x="8" y="8" width="240" height="240" rx="54" fill="#FFFFFF"/>
      <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M 206 84 L 158 84 L 158 118 L 206 118 L 206 172 L 158 172" stroke="#000000" stroke-width="38"/>
        <path d="M 42 194 L 92 70 L 142 194" stroke="#FFFFFF" stroke-width="64"/>
        <path d="M 42 194 L 92 70 L 142 194" stroke="#000000" stroke-width="38"/>
      </g>
    </mask>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="#C41E3A"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#a16-chrome)" mask="url(#a16-cut)"/>
</svg>
