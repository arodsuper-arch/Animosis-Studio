<?xml version="1.0" encoding="UTF-8"?>
<!--
  Animosis Studio — primary mark (Route D, "chromium plate")
  Original artwork. Letterforms are drawn as stroke geometry, not typeset,
  so this file depends on no font and carries no third-party licence.
  Master size 256. Use animosis-mark-16.svg below 24px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Animosis Studio">
  <defs>
    <linearGradient id="a-chrome" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#585858"/>
      <stop offset="34%" stop-color="#2B2B2B"/>
      <stop offset="51%" stop-color="#434343"/>
      <stop offset="76%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="a-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B70"/>
      <stop offset="60%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#6E0C1E"/>
    </linearGradient>
    <linearGradient id="a-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="a-cut">
      <rect x="8" y="8" width="240" height="240" rx="54" fill="#FFFFFF"/>
      <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
        <!-- S -->
        <path d="M 214 78 L 154 78 L 154 118 L 214 118 L 214 178 L 154 178" stroke="#000000" stroke-width="23"/>
        <!-- A: white halo first so it reads as passing behind the S -->
        <path d="M 34 200 L 90 60 L 146 200" stroke="#FFFFFF" stroke-width="41"/>
        <path d="M 58 156 L 122 156" stroke="#FFFFFF" stroke-width="41"/>
        <path d="M 34 200 L 90 60 L 146 200" stroke="#000000" stroke-width="23"/>
        <path d="M 58 156 L 122 156" stroke="#000000" stroke-width="23"/>
      </g>
    </mask>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#a-glow)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#a-chrome)" mask="url(#a-cut)"/>
  <rect x="9" y="9" width="238" height="238" rx="53" fill="none" stroke="url(#a-edge)" stroke-width="2"/>
</svg>
