<!doctype html>
<html lang="en" data-state="checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animosis Patcher</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Custom title bar. Frameless window; data-tauri-drag-region makes it draggable. -->
<header class="titlebar" data-tauri-drag-region>
  <svg class="titlebar__mark" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true">
    <defs>
      <linearGradient id="tbc" x1="0" y1="0" x2="0.45" y2="1">
        <stop offset="0%" stop-color="#666"/><stop offset="46%" stop-color="#2E2E2E"/><stop offset="100%" stop-color="#101010"/>
      </linearGradient>
      <mask id="tbm">
        <rect x="8" y="8" width="240" height="240" rx="54" fill="#fff"/>
        <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
          <path d="M 206 84 L 158 84 L 158 118 L 206 118 L 206 172 L 158 172" stroke="#000" stroke-width="38"/>
          <path d="M 42 194 L 92 70 L 142 194" stroke="#fff" stroke-width="64"/>
          <path d="M 42 194 L 92 70 L 142 194" stroke="#000" stroke-width="38"/>
        </g>
      </mask>
    </defs>
    <rect x="8" y="8" width="240" height="240" rx="54" fill="#C41E3A"/>
    <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tbc)" mask="url(#tbm)"/>
  </svg>
  <span class="titlebar__name">Animosis Patcher</span>
  <div class="titlebar__spacer" data-tauri-drag-region></div>
  <button type="button" class="winbtn" id="btn-minimize" aria-label="Minimize">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
  </button>
  <button type="button" class="winbtn winbtn--close" id="btn-close" aria-label="Close">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
  </button>
</header>

<main class="app">

  <div class="head">
    <h1 class="head__title" id="headline">Checking for updates</h1>
    <p class="head__sub" id="subline">Contacting the stable channel&hellip;</p>
  </div>

  <!-- Progress. Hidden unless the state uses it; aria-hidden follows suit. -->
  <section class="progress" id="progress" hidden>
    <div class="bar" role="progressbar" aria-labelledby="headline" aria-valuemin="0" aria-valuemax="100" id="bar">
      <div class="bar__fill" id="bar-fill"></div>
    </div>
    <div class="progress__meta">
      <span class="progress__what" id="progress-what">&nbsp;</span>
      <span class="progress__nums mono" id="progress-nums">&nbsp;</span>
    </div>
  </section>

  <!-- Change list, shown when an update is available. -->
  <section class="changes" id="changes" hidden>
    <ul class="changes__list" id="changes-list"></ul>
    <div class="changes__total">
      <span id="changes-count">&nbsp;</span>
      <span class="mono" id="changes-size">&nbsp;</span>
    </div>
  </section>

  <!-- Status callout. Never colour alone: icon + text + left rule. -->
  <section class="callout" id="callout" hidden>
    <svg class="callout__icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" id="callout-icon"></svg>
    <div class="callout__body">
      <p class="callout__title" id="callout-title"></p>
      <p class="callout__text" id="callout-text"></p>
    </div>
  </section>

  <!-- Log. Not a scrollback dump: the last few lines, so the user can see it working. -->
  <section class="log" id="log" hidden>
    <ol class="log__lines mono" id="log-lines" aria-live="polite" aria-relevant="additions"></ol>
  </section>

  <footer class="foot">
    <span class="foot__sig" id="sig" hidden>
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 1.5l5 2v4c0 3-2 5.3-5 7-3-1.7-5-4-5-7v-4l5-2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M5.6 8l1.7 1.7L10.6 6.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="sig-text">Signature verified</span>
    </span>
    <span class="foot__ver mono" id="ver">&nbsp;</span>
    <div class="foot__actions">
      <button type="button" class="btn btn--ghost" id="btn-secondary" hidden></button>
      <button type="button" class="btn btn--primary" id="btn-primary" hidden></button>
    </div>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
